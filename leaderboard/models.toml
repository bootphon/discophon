# Leaderboard registry: one table per model, keyed by the model key.
# The scores of each model are in scores/{track}/{key}.jsonl. See docs/guide/submission.md.
#
# Fields:
#   label        display name (required)
#   category     "submission", "baseline" or "topline" (required)
#   url          link to the checkpoint or paper (required)
#   description  one or two sentences, shown on hover (optional)
#   partial      allow incomplete scores; averages are only shown when complete (optional)

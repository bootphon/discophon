# Community leaderboard submissions. Each section is keyed by the model key, which also
# selects the model's score rows (scores/{model-key}-0.jsonl) and the in-page description
# section (#model-{model-key}) that leaderboard.py generates from this metadata.
# leaderboard.py discovers entries by iterating this file and adds each as
# category = "submission", filtered to the matching track.
#
# Schema (see SUBMISSION.md) — every field is required:
#   label       display name in the table
#   track       "many-to-one" | "one-to-one"
#   step_units  --step-units used at evaluation (positive int)
#   url         link to the checkpoint or paper
#   authors     "First Last (Institution)"
#   year        publication year (positive int)
#   description one or two sentences on the model
#
# Example:
#   [wav2vec2-large-robust]
#   label       = "Wav2Vec2 Large Robust"
#   track       = "many-to-one"
#   step_units  = 20
#   url         = "https://huggingface.co/org/checkpoint"
#   authors     = "First Last (Institution)"
#   year        = 2026
#   description = "One or two sentences on architecture and training setup."
